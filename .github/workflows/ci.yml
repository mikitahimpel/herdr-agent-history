name: CI
on:
  push:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  quality:
    name: Quality gate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tooling
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting, lint, tests, and release build
        run: ./scripts/check
